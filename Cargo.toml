[package]
name = "the-labyrinth"
version = "0.0.1"
authors = ["Leandro Lisboa Penz <lpenz@lpenz.org>"]
build = "build.rs"
edition = "2018"

[lib]
doctest = false

[build-dependencies]
rustsourcebundler = "0.10.2"
# rustsourcebundler = { git = "https://github.com/lpenz/rust-sourcebundler", branch = "devel" }

[dependencies]
itertools = "0.11.0"
libc = "0.2.147"
rand = "0.8.5"
regex = "1.8.4"
# time = "0.2.26"

[dev-dependencies]
anyhow = "1"

[dependencies.chrono]
version = "0.4.26"
default-features = false
features = ["clock"]

